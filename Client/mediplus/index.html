<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MediPlus Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
        }
        .card {
            border-radius: 15px;
            background: white;
            color: black;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .btn-custom {
            background: #6a11cb;
            border: none;
            color: white;
        }
        .btn-custom:hover {
            background: #2575fc;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <h3 class="text-center mb-4">MediPlus Payment</h3>
                    
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" placeholder="Enter your full name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-control" placeholder="Enter your address">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Amount ($)</label>
                            <input type="number" class="form-control" placeholder="Enter amount">
                        </div>
                        <h5 class="mt-3">Payment Method</h5>
                        <select class="form-select mb-3" id="paymentMethod">
                            <option value="credit">Credit/Debit Card</option>
                            <option value="upi">UPI/QR Code</option>
                            <option value="paypal">PayPal</option>
                        </select>

                        <div id="creditCardDetails" class="hidden">
                            <div class="mb-3">
                                <label class="form-label">Card Number</label>
                                <input type="text" class="form-control" placeholder="Enter card number">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">CVV</label>
                                <input type="password" class="form-control" placeholder="Enter CVV">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Expiry Date</label>
                                <input type="text" class="form-control" placeholder="MM/YY">
                            </div>
                        </div>

                        <div id="qrCodeDetails" class="text-center hidden">
                            <p>Scan QR Code</p>
                            <img src="https://via.placeholder.com/150" alt="QR Code">
                        </div>

                        <button type="submit" class="btn btn-custom w-100 mt-3">Proceed to Pay</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('paymentMethod').addEventListener('change', function() {
            document.getElementById('creditCardDetails').classList.add('hidden');
            document.getElementById('qrCodeDetails').classList.add('hidden');

            if (this.value === 'credit') {
                document.getElementById('creditCardDetails').classList.remove('hidden');
            } else if (this.value === 'upi') {
                document.getElementById('qrCodeDetails').classList.remove('hidden');
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
