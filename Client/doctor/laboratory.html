<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratory Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            height: 100vh;
            background: #007bff;
            color: white;
            padding: 20px;
        }
        .card-box {
            padding: 20px;
            border-radius: 8px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 d-md-block sidebar">
                <h2 class="text-white">MediPlus</h2>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link text-white" href="#">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Tests</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Reports</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Settings</a></li>
                </ul>
            </nav>
            
            <!-- Main Content -->
            <main class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center">
                    <h2>Laboratory Dashboard</h2>
                    <button class="btn btn-primary">Logout</button>
                </div>
                
                <div class="row mt-4">
                    <div class="col-md-4">
                        <div class="card-box bg-primary text-center">
                            <h5>Today's Tests</h5>
                            <h3>15</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card-box bg-warning text-center">
                            <h5>Pending Reports</h5>
                            <h3>8</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card-box bg-success text-center">
                            <h5>Completed Tests</h5>
                            <h3>27</h3>
                        </div>
                    </div>
                </div>
                
                <h3 class="mt-4">Upcoming Test Appointments</h3>
                <table class="table table-bordered mt-3">
                    <thead class="table-light">
                        <tr>
                            <th>Patient</th>
                            <th>Time</th>
                            <th>Test Type</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>John Doe</td>
                            <td>2025-03-06 10:00 AM</td>
                            <td>Blood Test</td>
                            <td>
                                <button class="btn btn-success btn-sm">Approve</button>
                                <button class="btn btn-danger btn-sm">Remove</button>
                            </td>
                        </tr>
                        <tr>
                            <td>Mary Jane</td>
                            <td>2025-03-07 11:30 AM</td>
                            <td>X-Ray</td>
                            <td>
                                <button class="btn btn-success btn-sm">Approve</button>
                                <button class="btn btn-danger btn-sm">Remove</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
