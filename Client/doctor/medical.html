<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment History - MediPlus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            height: 100vh;
            background: #007bff;
            color: white;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 d-md-block sidebar">
                <h2 class="text-white">MediPlus</h2>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link text-white" href="#">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Appointments</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Patients</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Reports</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Settings</a></li>
                </ul>
            </nav>
            
            <!-- Main Content -->
            <main class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center">
                    <h2>Appointment History</h2>
                    <button class="btn btn-primary">Logout</button>
                </div>
                
                <label class="mt-3">Filter by Date:</label>
                <input type="date" class="form-control w-25">
                
                <h3 class="mt-4">Past Appointments</h3>
                <table class="table table-bordered mt-3">
                    <thead class="table-light">
                        <tr>
                            <th>Patient</th>
                            <th>Time</th>
                            <th>Condition</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>John Doe</td>
                            <td>2025-03-01 10:00 AM</td>
                            <td>General Checkup</td>
                            <td class="text-success"><button class="btn btn-primary">view</button></td>
                        </tr>
                        <tr>
                            <td>Jane Smith</td>
                            <td>2025-02-28 11:00 AM</td>
                            <td>Flu Symptoms</td>
                            <td class="text-danger">Cancelled</td>
                        </tr>
                    </tbody>
                </table>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
